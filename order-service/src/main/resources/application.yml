spring:
  application:
    name: order-service
  kafka:
    # Listener EXTERNAL du broker : annonce localhost:9092 (cf. infra/docker-compose.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Cle en String : c'est le hash de ces octets qui choisit la partition.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 (tools.jackson) : spring-kafka 4.2 fournit DEUX familles de serdes.
      # JacksonJsonSerializer -> Jackson 3. JsonSerializer (sans prefixe) -> Jackson 2.
      # Phase 1 : JSON nu. La phase 2 remplacera ceci par le serialiseur JSON Schema
      # de Confluent, adosse au Schema Registry.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Defaut : true, ce qui ajoute un header __TypeId__ contenant le nom de classe Java.
        # WHY false : ce header couple les consumers aux noms de classes du producteur. Le
        # routage doit se faire sur eventType (dans l'enveloppe), pas sur un package Java —
        # sinon aucun consumer non-Java ne peut lire le topic, et renommer une classe casse
        # la production.
        spring.json.add.type.headers: false
    consumer:
      # earliest en dev : un nouveau consumer group rejoue tout l'historique du topic.
      # Defaut Kafka = latest, qui masquerait les messages deja publies.
      auto-offset-reset: earliest

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
