spring:
  application:
    name: notification-service
  kafka:
    # Listener EXTERNAL du broker : annonce localhost:9092 (cf. infra/docker-compose.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      # Le groupe est l'unite de partage du travail : les partitions d'un topic sont
      # reparties entre les membres d'un MEME groupe. Surchargeable par variable d'env pour
      # l'experience P1-T5 (deux groupes -> chacun recoit tout).
      group-id: ${CONSUMER_GROUP:notification-service}
      # earliest en dev : un nouveau consumer group rejoue tout l'historique du topic.
      # Defaut Kafka = latest, qui masquerait les messages deja publies.
      # N'agit QUE si le groupe n'a pas d'offset commite : un groupe connu reprend ou il
      # en etait, quelle que soit cette valeur.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Phase 2 : le message commence par un octet 0 puis l'id du schema sur 4 octets. Ce
      # deserialiseur lit cet id, va chercher le schema dans le registre, et construit le
      # type demande ci-dessous. Un JacksonJsonDeserializer nu echouerait sur ces 5 octets.
      #
      # ATTENTION, faille volontaire de la phase 1 toujours en place : ce deserialiseur est
      # nu. Un message mal forme echoue AVANT le listener, l'offset n'est jamais commite,
      # la partition est bloquee. La phase 4 ajoute ErrorHandlingDeserializer puis
      # DefaultErrorHandler + DeadLetterPublishingRecoverer.
      value-deserializer: io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
      properties:
        # Le type a construire. Le wire format dit QUEL schema a servi, pas quelle classe
        # Java instancier : les deux informations sont distinctes, et c'est voulu — un
        # consumer Python lit le meme message sans connaitre ce nom.
        json.value.type: com.formation.eda.events.order.OrderPlaced
        # Valide aussi a la lecture : un message hors contrat est refuse au lieu d'etre
        # silencieusement tronque. Defaut false.
        json.fail.invalid.schema: true
        # Defaut true : un champ inconnu fait echouer la deserialisation. A false, un
        # consumer qui n'a pas encore le nouveau schema ignorerait les champs ajoutes —
        # c'est ce qui rend l'evolution BACKWARD supportable (cf. P2-T5).
        json.fail.unknown.properties: false

server:
  port: ${SERVER_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
