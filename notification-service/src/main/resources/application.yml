spring:
  application:
    name: notification-service
  kafka:
    # Listener EXTERNAL du broker : annonce localhost:9092 (cf. infra/docker-compose.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Le groupe est l'unite de partage du travail : les partitions d'un topic sont
      # reparties entre les membres d'un MEME groupe. Surchargeable par variable d'env pour
      # l'experience P1-T5 (deux groupes -> chacun recoit tout).
      group-id: ${CONSUMER_GROUP:notification-service}
      # earliest en dev : un nouveau consumer group rejoue tout l'historique du topic.
      # Defaut Kafka = latest, qui masquerait les messages deja publies.
      # N'agit QUE si le groupe n'a pas d'offset commite : un groupe connu reprend ou il
      # en etait, quelle que soit cette valeur.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JacksonJsonDeserializer -> Jackson 3 (tools.jackson). JsonDeserializer -> Jackson 2.
      #
      # ATTENTION, faille volontaire de la phase 1 : ce deserialiseur est nu. Un seul message
      # mal forme dans le topic (un "{" seul, un champ du mauvais type) echoue AVANT que le
      # listener ne soit appele. Spring ne peut pas committer l'offset, repoll le meme
      # message, echoue a nouveau : la partition est bloquee pour toujours, par un seul
      # octet. C'est le poison message, et c'est exactement ce que la phase 4 corrige avec
      # ErrorHandlingDeserializer (delegation + capture de l'echec) puis DefaultErrorHandler
      # + DeadLetterPublishingRecoverer. Laisse nu ici pour pouvoir le provoquer et le voir.
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Le producteur n'envoie pas de header de type (spring.json.add.type.headers=false),
        # donc le consumer doit savoir quoi construire. Un seul type ici ; la phase 2
        # (Schema Registry) et la phase 4 (routage par eventType) traiteront les topics
        # multi-types.
        spring.json.value.default.type: com.formation.eda.events.order.OrderPlaced
        # Defaut : true. A false, un header de type envoye par un producteur mal configure
        # est ignore. WHY: ce header designe une classe a instancier — le croire, c'est
        # laisser le producteur choisir le type construit chez le consumer.
        spring.json.use.type.headers: false
        # Garde-fou complementaire : meme en cas de header de type, seules ces racines de
        # package peuvent etre instanciees.
        spring.json.trusted.packages: com.formation.eda.events

server:
  port: ${SERVER_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
