# Profil cloud-stream : meme consommation que le @KafkaListener, via Spring Cloud Stream.
# Lancer avec :
#   java -jar notification-service/target/notification-service-0.1.0-SNAPSHOT.jar \
#        --spring.profiles.active=cloud-stream
#
# Sert a comparer les deux modeles sur le meme cas (P1-T7, ADR-002).

spring:
  kafka:
    consumer:
      # Aligne sur le groupe du binding ci-dessous. Le groupe qui compte est celui declare
      # dans spring.cloud.stream.bindings ; cette propriete ne sert qu'a ce que /stats
      # n'affiche pas le groupe de l'autre modele.
      group-id: notification-service-cs
  cloud:
    function:
      # Sans cette ligne, un contexte contenant plusieurs beans fonctionnels ne sait pas
      # lequel brancher. Le nom est celui de la METHODE @Bean.
      definition: onOrderPlaced
    stream:
      bindings:
        # Convention de nommage imposee : <fonction>-in-<index>. Aucun rapport avec le nom
        # du topic, qui est donne par "destination".
        onOrderPlaced-in-0:
          destination: shop.order.events.v1
          # Equivalent de group.id. WHY un groupe different de celui du @KafkaListener :
          # pour pouvoir lancer les deux variantes a la suite sans que l'une herite des
          # offsets de l'autre, et donc comparer sur la meme matiere.
          group: notification-service-cs
          consumer:
            # Equivalent de auto-offset-reset: earliest. Nomme autrement : le binder a son
            # propre vocabulaire par-dessus celui de Kafka, ce qui est precisement le cout
            # de l'abstraction.
            start-offset: earliest
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          # Le binder cree les topics absents par defaut ; le broker refuse la creation
          # implicite (auto.create.topics.enable=false) et les topics sont declares dans
          # infra/topics. On le dit explicitement pour que l'intention soit lisible.
          auto-create-topics: false
          consumer-properties:
            schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
            # Depuis la phase 2, le payload est precede de l'octet 0 et de l'id du schema.
            # C'est donc un deserialiseur Kafka qui doit lire le message, pas un
            # MessageConverter de Spring Messaging : celui-ci verrait 5 octets parasites.
            value.deserializer: io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
            json.value.type: com.formation.eda.events.order.OrderPlaced
            json.fail.invalid.schema: true
            json.fail.unknown.properties: false
        bindings:
          onOrderPlaced-in-0:
            consumer:
              # A true, le binder laisse le Deserializer Kafka faire la conversion et ne
              # tente pas la sienne. C'est la difference de fond entre les deux modeles
              # (cf. ADR-002) : ici il faut la desactiver explicitement pour que le format
              # Confluent passe.
              use-native-decoding: true
