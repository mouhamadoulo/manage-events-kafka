# Ou vit chaque schema : <titre du schema> = <topic>
#
# Le sujet du Schema Registry en decoule par TopicRecordNameStrategy :
#   sujet = <topic>-<titre>
# Exemple : OrderPlaced -> shop.order.events.v1-OrderPlaced
#
# WHY ce fichier : le schema seul ne dit pas sur quel topic il circule, et le topic seul ne
# dit pas quels types il transporte. Un topic metier en portera plusieurs des la phase 6
# (OrderPlaced, OrderCancelled, OrderCompleted sur shop.order.events.v1). Cette table est
# lue par le script d'enregistrement ET par un test qui verifie qu'aucun schema n'est
# orphelin.

OrderPlaced=shop.order.events.v1
