# Infra locale du laboratoire EDA.
# Kafka 4.4.0 en mode KRaft (aucun ZooKeeper : supprime depuis Kafka 4.0).
#
# Securite : tous les ports publies sont lies a 127.0.0.1. Ni le broker, ni Postgres,
# ni le Schema Registry, ni l'UI n'exigent d'authentification ici (PLAINTEXT partout) :
# sans le bind loopback, n'importe quelle machine du reseau local pourrait lire et ecrire
# dans les topics. Les identifiants Postgres triviaux ne valent que pour ce poste.
# SASL/SCRAM + TLS + ACLs sont traites en phase 12 (P12-T4, P12-T5).
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down -v

name: manage-events-kafka

services:

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    ports:
      # Seul port expose a l'hote : les clients Spring se connectent sur localhost:9092.
      # Bind sur 127.0.0.1 : aucun listener PLAINTEXT accessible depuis le reseau local.
      - "127.0.0.1:9092:9092"
    environment:
      # --- Identite du noeud KRaft -------------------------------------------------
      # Mode "combined" : ce noeud est a la fois broker et controller. Acceptable en dev,
      # jamais en production (cf. P12-T6 : passage a 3 noeuds).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Obligatoire quand KAFKA_PROCESS_ROLES est defini : l'image formate le storage avec cet ID.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # --- Listeners ---------------------------------------------------------------
      # Trois listeners, car l'adresse annoncee depend de QUI se connecte :
      #   INTERNAL  -> annonce "kafka:19092" : utilise par schema-registry et kafka-ui (reseau Docker)
      #   EXTERNAL  -> annonce "localhost:9092" : utilise par les services Spring lances sur l'hote
      #   CONTROLLER-> quorum KRaft interne
      # WHY: un seul listener ne peut pas annoncer deux noms d'hote differents.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Topics internes ---------------------------------------------------------
      # Mono-noeud => replication 1. En production : 3 et min.insync.replicas=2.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # Defaut 3000 ms : retarde le premier rebalancing. A 0, les consumers demarrent tout de suite.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Creation implicite desactivee : les topics sont declares explicitement (infra/topics).
      # WHY: un typo de nom de topic doit echouer, pas creer un topic fantome a 1 partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Le prefixe est un PROTOCOLE DE SECURITE, pas un nom de listener : il doit correspondre
      # a kafkastore.security.protocol (PLAINTEXT par defaut). Mettre "INTERNAL://" echoue avec
      # "No supported Kafka endpoints are configured". Le port 19092 cible bien le listener INTERNAL.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Compatibilite BACKWARD globale : un nouveau schema doit pouvoir lire les anciens messages.
      # Teste en P2-T5 (ajout de champ optionnel -> OK, champ requis -> rejete).
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && echo -e 'GET /subjects HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      # Permet de creer topics / produire des messages depuis l'UI (pratique pour les experiences).
      # Equivaut a une console d'admin sans authentification : acceptable uniquement parce que
      # le port n'ecoute que sur 127.0.0.1. Ne jamais exposer ce service tel quel.
      DYNAMIC_CONFIG_ENABLED: "true"

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: eda
      POSTGRES_DB: postgres
    volumes:
      # Postgres 18+ : le montage doit etre sur /var/lib/postgresql, PAS sur .../data.
      # L'image place alors les donnees dans un sous-dossier nomme par version majeure,
      # ce qui permet pg_upgrade --link. Monter .../data fait echouer le demarrage.
      # Voir docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
      # Cree une base par service au premier demarrage (volume vide uniquement).
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kafka-data:
  postgres-data:
